services:
  - type: web
    name: linkplease
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/linkplease.db
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
